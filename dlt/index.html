<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大乐透数据实验室</title>
<meta name="description" content="大乐透最近50期开奖数据、号码频次与基础统计分析。">
<style>
:root{--bg:#080b11;--panel:#111722;--line:#263041;--text:#f5f7fb;--muted:#8f9bad;--red:#e33b48;--blue:#3478f6;--gold:#f2b94b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#172038 0,transparent 32rem),var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto;padding:36px 0 70px}.top{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--red);font-weight:700}.top h1{font-size:clamp(34px,6vw,64px);margin:8px 0 8px;letter-spacing:-.05em}.sub{color:var(--muted);margin:0}.badge{padding:10px 14px;border:1px solid var(--line);border-radius:999px;color:#cbd3df;font-size:13px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:rgba(17,23,34,.88);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.18)}.card h2{margin:0 0 16px;font-size:18px}.latest{display:flex;justify-content:space-between;gap:20px;align-items:center}.issue{font-size:14px;color:var(--muted)}.balls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.ball{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(145deg,#ff5a64,#c91f31);box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 7px 18px rgba(227,59,72,.22)}.ball.back{background:linear-gradient(145deg,#4b91ff,#1d5fd0);box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 7px 18px rgba(52,120,246,.22)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:16px;border:1px solid var(--line);border-radius:14px}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--muted)}.section{margin-top:18px}.freq{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.chip{padding:10px 6px;text-align:center;border:1px solid var(--line);border-radius:10px;background:#0d121b}.chip strong{display:block;font-size:15px}.chip small{color:var(--muted)}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-weight:600}.nums{font-variant-numeric:tabular-nums}.hint{font-size:12px;line-height:1.7;color:var(--muted);margin-top:18px}.status{font-size:13px;color:var(--muted)}@media(max-width:820px){.grid{grid-template-columns:1fr}.top{display:block}.badge{display:inline-block;margin-top:14px}.freq{grid-template-columns:repeat(5,1fr)}.stats{grid-template-columns:1fr 1fr 1fr}.table th:nth-child(2),.table td:nth-child(2){display:none}}@media(max-width:520px){.wrap{width:min(100% - 20px,1180px);padding-top:22px}.card{padding:16px;border-radius:14px}.ball{width:42px;height:42px}.freq{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="eyebrow">DLT DATA LAB</div><h1>大乐透数据实验室</h1><p class="sub">自动读取 GitHub 最新50期开奖数据 · 基础统计分析</p></div><div class="badge" id="updated">正在读取数据…</div></div>
  <div class="grid">
    <section class="card"><h2>最新一期</h2><div id="latest"></div></section>
    <section class="card"><h2>最近50期概览</h2><div class="stats" id="stats"></div></section>
  </div>
  <section class="card section"><h2>前区号码出现频次</h2><div class="freq" id="frontFreq"></div></section>
  <section class="card section"><h2>后区号码出现频次</h2><div class="freq" id="backFreq"></div></section>
  <section class="card section"><h2>最近开奖</h2><div style="overflow:auto"><table class="table"><thead><tr><th>期号</th><th>日期</th><th>前区</th><th>后区</th></tr></thead><tbody id="drawRows"></tbody></table></div></section>
  <p class="hint">说明：页面中的频次、和值、冷热等统计只反映历史数据，不代表未来开奖结果。大乐透每次开奖具有随机性，请理性参与。</p>
</div>
<script>
const pad=n=>String(n).padStart(2,'0');
fetch('../data/dlt/latest50.json',{cache:'no-store'})
.then(r=>{if(!r.ok)throw new Error('数据加载失败');return r.json()})
.then(data=>{
 const draws=data.draws||[]; const last=draws[draws.length-1];
 document.getElementById('updated').textContent=`数据更新：${data.updated_at} · 最新 ${data.latest_issue}期`;
 const fb=last.front.map(n=>`<span class="ball">${pad(n)}</span>`).join('');
 const bb=last.back.map(n=>`<span class="ball back">${pad(n)}</span>`).join('');
 document.getElementById('latest').innerHTML=`<div class="latest"><div><div class="issue">第 ${last.issue} 期 · ${last.date}</div><div class="balls">${fb}<span style="width:8px"></span>${bb}</div></div></div>`;
 let front=Array(36).fill(0),back=Array(13).fill(0),sum=0;
 draws.forEach(d=>{d.front.forEach(n=>{front[n]++;sum+=n});d.back.forEach(n=>back[n]++)});
 const hottest=Math.max(...front); const hotNums=front.map((v,i)=>v===hottest?i:null).filter(Boolean).map(pad).join(' / ');
 document.getElementById('stats').innerHTML=`<div class="stat"><b>${draws.length}</b><span>统计期数</span></div><div class="stat"><b>${hotNums}</b><span>前区最高频</span></div><div class="stat"><b>${hottest}</b><span>最高出现次数</span></div>`;
 document.getElementById('frontFreq').innerHTML=front.slice(1).map((v,i)=>`<div class="chip"><strong>${pad(i+1)}</strong><small>${v} 次</small></div>`).join('');
 document.getElementById('backFreq').innerHTML=back.slice(1).map((v,i)=>`<div class="chip"><strong>${pad(i+1)}</strong><small>${v} 次</small></div>`).join('');
 document.getElementById('drawRows').innerHTML=[...draws].reverse().slice(0,20).map(d=>`<tr><td>${d.issue}</td><td>${d.date}</td><td class="nums">${d.front.map(pad).join(' ')}</td><td class="nums">${d.back.map(pad).join(' ')}</td></tr>`).join('');
}).catch(e=>{document.getElementById('updated').textContent='数据加载失败';document.getElementById('latest').innerHTML='<p class="status">暂时无法读取数据，请稍后刷新页面。</p>'});
</script>
</body>
</html>
